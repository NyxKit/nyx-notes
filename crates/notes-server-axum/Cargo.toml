[package]
name = "notes-server-axum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "notes-server"
path = "src/main.rs"

[dependencies]
notes-core = { path = "../notes-core" }
notes-storage-fs = { path = "../notes-storage-fs" }
notes-auth = { path = "../notes-auth" }
async-trait = "0.1"
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = "1"
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs"] }
base64 = "0.22"
image = { version = "0.25", default-features = true }
async-stream = "0.3"

[dev-dependencies]
tower = "0.5"
tempfile = "3"
http-body-util = "0.1"
