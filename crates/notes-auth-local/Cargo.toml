[package]
name = "notes-auth-local"
version = "0.1.0"
edition = "2021"

[dependencies]
notes-core = { path = "../notes-core" }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
