[package]
name = "notes-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
notes-core = { path = "../notes-core" }
notes-storage-fs = { path = "../notes-storage-fs" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
