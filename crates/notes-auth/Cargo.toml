[package]
name = "notes-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
notes-core = { path = "../notes-core" }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { workspace = true }
serde_json = "1"
chrono = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

[dev-dependencies]
tempfile = "3"
